name: CI

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  release:
    # Only for x.y.z tags; branch pushes and PRs stop after tests.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs tags and history
      - name: Build app
        run: ./build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/Countdown.app "Countdown-${GITHUB_REF_NAME}.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "Countdown-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
